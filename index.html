<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playboi Carti — A Night With Carti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="canvas" aria-label="Concert landing page">

      <!-- ASSET PLACEHOLDER: logo -->
      <div class="asset-placeholder logo-placeholder">
        <img src="name.png" alt="Logo">
      </div>

      <nav class="nav">
        <a href="index.html">EVENT</a>
        <a href="#info">INFO</a>
        <a href="venue.html">VENUE</a>
        <a href="#faq">FAQ</a>
        <a class="nav-ticket" href="#tickets">GET TICKETS</a>
      </nav>

      <section class="hero" id="event">
        <p class="eyebrow">A NIGHT WITH</p>

        <h1>PLAYBOI<br class="title-break">CARTI</h1>

        <p class="subline">
          <span>ഗബ്രി</span>
          <b>LIVE IN CONCERT</b>
        </p>

        <div class="event-meta">
          <div class="meta-row">
            <span class="css-icon calendar-icon" aria-hidden="true"></span>
            <span>25 OCTOBER 2026</span>
          </div>
          <div class="meta-row location-row">
            <span class="css-icon pin-icon" aria-hidden="true"></span>
            <span>TBA<br><strong>INDIA</strong></span>
          </div>
        </div>

        <div class="countdown-wrap">
          <p>THE SHOW STARTS IN</p>
          <div class="countdown" aria-live="polite">
            <div><strong id="days">11</strong><span>DAYS</span></div>
            <i>:</i>
            <div><strong id="hours">05</strong><span>HOURS</span></div>
            <i>:</i>
            <div><strong id="minutes">42</strong><span>MINUTES</span></div>
            <i>:</i>
            <div><strong id="seconds">19</strong><span>SECONDS</span></div>
          </div>
        </div>

        <div class="actions" id="tickets">
          <a class="button primary" href="#tickets">
            <span>GET TICKETS</span><span class="arrow">↗</span>
          </a>
          <a class="button secondary" href="#info">
            <span>LEARN MORE</span><span class="arrow">↗</span>
          </a>
        </div>
      </section>

      <!-- ASSET PLACEHOLDER: artist image -->
     <div class="asset-placeholder artist-placeholder">
  <picture>
    <source media="(max-width: 600px)" srcset="artist1.png">
    <img src="artist.png" alt="Artist">
  </picture>
</div>

      <!-- ASSET PLACEHOLDER: bottom emblem -->
      <div class="asset-placeholder emblem-placeholder">
        <span>EMBLEM</span>
      </div>

      <!-- Minimal invisible anchors to preserve the original navigation -->
      <span id="info" class="anchor"></span>
      <span id="venue" class="anchor"></span>
      <span id="faq" class="anchor"></span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
