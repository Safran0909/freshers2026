<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Venue — Playboi Carti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="venue.css">
  <link rel="stylesheet" href="shared.css">
</head>

<body>

  <main class="venue-page">

    <!-- =====================================================
         LOGOS
         ===================================================== -->

    <div class="asset-placeholder logo-placeholder">
      <img src="sabka.png" alt="Sabka Swagath">
    </div>

    <div class="sponsor-logo">
      <img src="rumi.png" alt="Rumi's Mashawi">
    </div>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <nav class="nav">

      <button
        class="mobile-menu"
        type="button"
        aria-label="Open menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a href="/">EVENT</a>
      <a href="/info">INFO</a>
      <a href="/venue" class="active">VENUE</a>
      <a href="/faq">FAQ</a>

      <a
        class="nav-ticket"
        href="https://tickets.armado26.in"
      >
        GET TICKETS
      </a>

    </nav>


    <!-- =====================================================
         MOBILE MENU
         ===================================================== -->

    <div class="mobile-menu-panel">

      <button
        class="mobile-menu-close"
        type="button"
        aria-label="Close menu"
      >
        ×
      </button>

      <a href="/">EVENT</a>
      <a href="/info">INFO</a>
      <a href="/venue" class="active">VENUE</a>
      <a href="/faq">FAQ</a>

      <a href="https://tickets.armado26.in/login">
        LOGIN
      </a>

    </div>


    <!-- =====================================================
         VENUE CONTENT
         ===================================================== -->

    <section class="venue-content">

      <!-- LEFT CONTENT -->

      <div class="venue-copy">

        <p class="eyebrow">FIND YOUR WAY</p>

        <h1>
          KONICA <br>
          RESORT
        </h1>

        <a
          href="https://www.google.com/maps/search/?api=1&query=Konica+Resorts"
          class="directions-button"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>GET DIRECTIONS</span>
          <span class="arrow"></span>
        </a>

      </div>


      <!-- RIGHT MAP -->

      <div class="venue-map">

        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3411.074145573461!2d75.7359226!3d31.246370699999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x391af5986fe51ffb%3A0x3407c0d215c78785!2sKonica%20Resorts!5e0!3m2!1sen!2sin!4v1790188715968!5m2!1sen!2sin"
          width="600"
          height="450"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
